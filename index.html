<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Foco · Equilíbrio</title>
<!-- PWA / iOS -->
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foco">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tema (escuro padrão; body.light = claro) ===== */
:root{
  --bg:#262522;--surface:#1c1b19;--surface2:#322f2b;--border:#3a3733;
  --text:#ece9e3;--muted:#9c958b;--blue:#4a90d9;--blue-soft:rgba(74,144,217,.16);
  --green:#3fb950;--amber:#f0a500;--danger:#e0556b;
}
body.light{
  --bg:#f0f2f5;--surface:#fff;--surface2:#e8eaed;--border:#dde1e7;
  --text:#1a1a2e;--muted:#6b7280;--blue:#185FA5;--blue-soft:rgba(24,95,165,.1);
  --green:#2ea043;--amber:#d29922;--danger:#e0556b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 50% -10%,rgba(255,255,255,.04),transparent 60%),radial-gradient(700px 500px at 100% 110%,rgba(255,255,255,.025),transparent 55%),#161513;
  display:flex;align-items:center;justify-content:center;padding:14px;
}
body.light{background:radial-gradient(900px 600px at 50% -10%,rgba(24,95,165,.18),transparent 60%),radial-gradient(700px 500px at 100% 110%,rgba(13,61,107,.12),transparent 55%),#c9d3e0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button:disabled{opacity:.28;cursor:default}

/* ===== moldura: mockup de celular no desktop, tela cheia no celular/instalado ===== */
.phone{
  width:min(100%,392px);height:min(94vh,840px);background:var(--bg);border-radius:38px;
  border:1px solid rgba(255,255,255,.08);overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 8px #05080f,0 30px 70px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5);
}
body.light .phone{box-shadow:0 0 0 8px #2a3344,0 30px 70px rgba(0,0,0,.35)}
@media (display-mode:standalone),(max-width:480px){
  body{display:block;padding:0;background:var(--bg)}
  .phone{width:100%;max-width:none;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .screen{padding-top:calc(12px + env(safe-area-inset-top))}
}
body.standalone{display:block;padding:0;background:var(--bg)}
body.standalone .phone{width:100%;max-width:none;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
body.standalone .screen{padding-top:calc(12px + env(safe-area-inset-top))}

.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ===== barra inferior ===== */
.tabbar{flex-shrink:0;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.68rem;font-weight:600;text-align:center}
.tab .ti{font-size:1.45rem}
.tab.on{color:var(--blue)}

/* ===== cabeçalho ===== */
.hd{margin-bottom:14px}
.hd-row{display:flex;align-items:center;gap:2px;min-height:44px}
.hd h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;padding:0 2px}
.hd-sub{font-size:.8rem;color:var(--muted);margin-top:1px}
.nav{width:36px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--muted);flex-shrink:0}
.nav.first{margin-left:-10px}
.nav:active{background:var(--surface2)}
.grow{flex:1}
.sync{width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:var(--muted);flex-shrink:0}
.sync.s-ok{color:var(--green)} .sync.s-up{color:var(--blue)} .sync.s-erro{color:var(--danger)}
.pt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;height:46px;padding:0 10px;border-radius:14px;background:var(--blue-soft);color:var(--blue);line-height:1;flex-shrink:0}
.pt small{font-size:.54rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.9}
.pt b{font-size:1.2rem;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

/* ===== blocos ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card.pad{padding:14px}
.grp{margin-bottom:14px}
.grp-h{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 4px 7px}
.row,.lrow,.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-top:1px solid var(--border)}
.card>.row:first-child,.card>.lrow:first-child,.card>.prow:first-child{border-top:0}
button.row:active,button.lrow:active,button.prow:active{background:var(--surface2)}
.ric{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--muted);flex-shrink:0}
.row.on .ric{color:var(--blue);background:var(--blue-soft)}
.rtx{flex:1;min-width:0;display:flex;flex-direction:column}
.rtx b{font-size:.93rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtx small{font-size:.73rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:.9rem;margin-right:6px;transition:background .12s,border-color .12s}
.row.on .ck{background:var(--blue);border-color:var(--blue)}
.notas{display:flex;gap:2px;flex-shrink:0;margin-right:-6px}
.nt{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;color:var(--muted)}
.nt.on.n0{background:rgba(224,85,107,.16);color:var(--danger)}
.nt.on.n1{background:rgba(240,165,0,.16);color:var(--amber)}
.nt.on.n2{background:rgba(63,185,80,.16);color:var(--green)}
.row.off{opacity:.62}
.lrow.off .ric,.lrow.off .rtx{opacity:.62}
.chev{color:var(--muted);font-size:1.05rem;flex-shrink:0}

.banner{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;min-height:46px;border-radius:12px;background:var(--blue-soft);font-size:.85rem;margin-bottom:12px}
.banner>.ti{color:var(--blue);font-size:1.1rem}
.banner span{flex:1}
.lnk{color:var(--blue);font-weight:600;font-size:.85rem;min-height:40px;padding:0 8px;display:inline-flex;align-items:center}
.lnk.danger{color:var(--danger)}
.lnk.center{display:flex;margin:16px auto 0}
.ac{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ac-t{font-size:.9rem;font-weight:600}
.ac-s{font-size:.78rem;color:var(--muted);margin-top:2px;line-height:1.4}
.ac-l{margin-top:6px}
.ac-l .lrow{padding:6px 0;min-height:50px}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:42px;padding:0 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;white-space:nowrap}
.btn:active{opacity:.8}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.wide{display:flex;width:100%;margin-top:10px}
.btn.sm{flex:0 0 auto;min-height:40px;padding:0 12px;font-size:.78rem}
.btn.dng{color:var(--danger);border-color:var(--danger);background:transparent}
.fechar{width:100%;min-height:50px;margin-top:4px;border-radius:14px;border:1px dashed var(--border);color:var(--muted);font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.fechar:active{background:var(--surface2)}
.fechar.done{border-style:solid;color:var(--green);cursor:pointer}
.row.trv,.row.trv .notas{opacity:.5}
.pausados{font-size:.76rem;color:var(--muted);text-align:center;padding:2px 0 14px}
.vazio{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 12px;line-height:1.45}

/* ===== equilíbrio ===== */
.lbl{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.big b{font-size:3rem;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dl{font-size:.85rem;font-weight:600} .dl.pos{color:var(--green)} .dl.neg{color:var(--danger)}
.curva{display:block;width:100%;height:auto;overflow:visible}
.cv-ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.cv-line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cv-area{fill:var(--blue);fill-opacity:.1}
.cv-pt{fill:var(--blue)}
.cv-t{fill:var(--muted);font-size:9px;font-family:Inter,sans-serif}
.leg{font-size:.72rem;color:var(--muted);margin-top:8px;line-height:1.4}
.nota{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.4}
.sec{font-size:.95rem;font-weight:700;margin:22px 2px 8px}
.prow{min-height:48px;padding:6px 14px}
.prow .ti{font-size:1.1rem;color:var(--muted)}
.pn{flex:1;font-size:.9rem;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.pv.c-pausado,.pv.c-sem{color:var(--muted);font-weight:500;font-size:.82rem}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.dot.c-verde{background:var(--green)} .dot.c-amarelo{background:var(--amber)} .dot.c-vermelho{background:var(--danger)}
.dot.c-pausado{background:transparent;border:2px solid var(--muted)} .dot.c-sem{background:transparent;border:2px dashed var(--border)}
.radar{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;overflow:visible}
.rd-ring{fill:none;stroke:var(--border);stroke-width:1}
.rd-ax{stroke:var(--border);stroke-width:1}
.rd-area{fill:var(--blue);fill-opacity:.22;stroke:var(--blue);stroke-width:2;stroke-linejoin:round}
.rd-pt{fill:var(--blue)}
.rd-l{fill:var(--text);font-size:11px;font-weight:600;font-family:Inter,sans-serif}
.rd-l.off{fill:var(--muted)}
.rd-v{fill:var(--muted);font-size:10px;font-weight:500}

/* ===== pilares / ajustes ===== */
.sw{width:44px;height:26px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);position:relative;flex-shrink:0;transition:.18s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.18s}
.sw.on{background:var(--blue);border-color:var(--blue)}
.sw.on::after{background:#fff;transform:translateX(18px)}
.sug{padding:14px;margin-bottom:4px}
.sug-t{display:flex;gap:10px;font-size:.88rem;line-height:1.45}
.sug-t .ti{color:var(--blue);font-size:1.2rem;flex-shrink:0}
.rodape{text-align:center;font-size:.66rem;color:var(--muted);margin-top:24px;opacity:.75}

/* ===== folhas (bottom sheet) ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.show{display:flex}
.modal{width:100%;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--border);padding:8px 16px calc(22px + env(safe-area-inset-bottom));animation:slideup .25s cubic-bezier(.2,.8,.3,1);scrollbar-width:none}
.modal::-webkit-scrollbar{display:none}
@keyframes slideup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:4px;margin:0 -8px 10px;min-height:48px}
.sh-h h3{flex:1;font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h .pv{margin-right:8px}
.sh-sec{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 4px 7px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.fg input,.fg select{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:0 12px;font-size:16px;font-family:inherit}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--blue)}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:.8rem;font-weight:600;color:var(--muted);text-align:center;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icgrid button{height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:1.3rem;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icgrid button.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.info{font-size:.88rem;line-height:1.45}

.toast{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.65rem 1.05rem;border-radius:13px;font-size:.8rem;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
</style>
</head>
<body class="dark">

<div class="phone">
  <main class="screen" id="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-a="aba" data-id="hoje" id="tab-hoje"><i class="ti ti-list-check"></i>Hoje</button>
    <button class="tab" data-a="aba" data-id="eq" id="tab-eq"><i class="ti ti-chart-radar"></i>Equilíbrio</button>
    <button class="tab" data-a="aba" data-id="pilares" id="tab-pilares"><i class="ti ti-settings"></i>Pilares</button>
  </nav>

  <div class="overlay" id="ov"><div class="modal" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="equilibrio.js"></script>
<script>
/* Foco v2 · Equilíbrio — app (UI + sync). Domínio em equilibrio.js (window.EQ). ES5. */
/* PWA instalado: desfaz o mockup de celular (fallback p/ iOS sem @media display-mode) */
try{if(window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode:standalone)').matches))document.body.classList.add('standalone');}catch(e){}

if(!window.EQ){document.getElementById('screen').innerHTML='<div class="vazio">Não consegui carregar o módulo do Foco. Abra de novo com internet.</div>';throw new Error('Foco: equilibrio.js não carregou');}

/* ===== estado ===== */
var S={plano:null,registros:{},ajustes:null};
var hojeStr=EQ.hoje();
var diaVer=hojeStr;
var aba='hoje',abaAnterior='';
var P=null;              // pontuação do último render
var sugAtual=null;       // sugestão exibida na aba Pilares
var folhas=[];           // pilha de folhas: {fn, vivo}
var ed=null;             // estado do editor de hábito
var pushMsg='';

/* ===== localStorage (prefixo foco2_; só estas chaves) ===== */
var LS='foco2_';
var LS_OK={plano:1,registros:1,ajustes:1,tema:1,lastSync:1};
var _avisoLS=false;
function lsLer(k){if(!LS_OK[k])return null;try{return localStorage.getItem(LS+k);}catch(e){return null;}}
function lsGravar(k,txt){if(!LS_OK[k])return false;try{localStorage.setItem(LS+k,txt);return true;}catch(e){return false;}}
function lsObj(k){var t=lsLer(k);if(!t)return null;try{return JSON.parse(t);}catch(e){return null;}}
function lsValido(k,o){return k==='plano'?planoValido(o):(k==='registros'?registrosValidos(o):ajustesValidos(o));}
/* outra instância na mesma origem (aba, iframe do HUB, PWA) pode ter gravado no LS depois de nós:
   junta o LS na memória. Por objeto (plano/ajustes) e por dia (registros) vence o maior _t; empate fica com a memória.
   Devolve true se o LS trouxe algo que a memória não tinha. */
function juntarLS(k){
  var o=lsObj(k);if(!S[k]||!lsValido(k,o))return false;
  var a={},b={};a[k]=o;b[k]=S[k];
  var m=EQ.mergeEstado(a,b);            // local = LS, nuvem = memória (empate fica com a memória)
  if(!m.subir[k])return false;          // subir[k] = o LS contribuiu com algo
  S[k]=m[k];
  return true;
}
function persistir(k){
  if(k!=='plano'&&k!=='registros'&&k!=='ajustes')return;
  if(juntarLS(k)&&cloudUser)pend[k]=true;   // o que veio da outra instância também precisa subir
  if(!lsGravar(k,JSON.stringify(S[k]))&&!_avisoLS){_avisoLS=true;toast('Não consegui salvar neste aparelho');}
}

/* ===== utilidades ===== */
function p2(n){return (n<10?'0':'')+n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function copia(o){var r={};if(o)for(var k in o)if(Object.prototype.hasOwnProperty.call(o,k))r[k]=o[k];return r;}
function icone(n){return '<i class="ti ti-'+esc(n||'circle')+'"></i>';}
function plural(n,um,varios){return n+' '+(n===1?um:varios);}
var DIAS_SEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var DIAS_CURTO=['dom','seg','ter','qua','qui','sex','sáb'];
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dObj(ds){return new Date(ds+'T12:00:00');}
function fmtLongo(ds){var d=dObj(ds);return DIAS_SEM[d.getDay()]+', '+d.getDate()+' '+MESES[d.getMonth()];}
function fmtCurto(ds){var d=dObj(ds);return DIAS_CURTO[d.getDay()]+', '+d.getDate()+' '+MESES[d.getMonth()];}
function fmtDM(ds){var d=dObj(ds);return p2(d.getDate())+'/'+p2(d.getMonth()+1);}
var _tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},2200);}

/* ===== tema ===== */
function aplicarTema(t){if(t!=='light')t='dark';document.body.classList.remove('light','dark');document.body.classList.add(t);}
function temaAtual(){return document.body.classList.contains('light')?'light':'dark';}

/* ===== acesso ao plano ===== */
function ctx(){return {plano:S.plano,registros:S.registros,ajustes:S.ajustes};}
function habito(id){var hs=(S.plano&&S.plano.habitos)||[];for(var i=0;i<hs.length;i++)if(hs[i]&&hs[i].id===id)return hs[i];return null;}
function pilar(id){var ps=(S.plano&&S.plano.pilares)||[];for(var i=0;i<ps.length;i++)if(ps[i]&&ps[i].id===id)return ps[i];return null;}
function ativosDoPilar(pid){return EQ.habitosAtivos(S.plano).filter(function(h){return h.pid===pid;});}
function inicio(){return (S.ajustes&&S.ajustes.inicio)||hojeStr;}
function minDia(){var a=EQ.addDias(hojeStr,-7),i=inicio();return a>i?a:i;}
function ontemStr(){return EQ.addDias(hojeStr,-1);}
function pilarPont(pid){var ps=(P&&P.pilares)||[];for(var i=0;i<ps.length;i++)if(ps[i].id===pid)return ps[i];return null;}
function viagemAberta(){
  var vs=(S.ajustes&&S.ajustes.viagens)||[];
  for(var i=0;i<vs.length;i++)if(vs[i]&&!vs[i].ate&&vs[i].de<=hojeStr)return i;
  return -1;
}
function valorTxt(pp){if(!pp)return '—';if(pp.cor==='pausado')return 'pausado';return pp.valor===null?'—':String(pp.valor);}

/* ===== carregar ===== */
function carregar(){
  var pl=lsObj('plano'),rg=lsObj('registros'),aj=lsObj('ajustes');
  if(!rg||typeof rg!=='object'||Object.prototype.toString.call(rg)==='[object Array]')rg={};
  S.registros=rg;
  if(!pl||!pl.pilares||!pl.habitos||!aj||!aj.inicio){
    var sd=EQ.seed(hojeStr);
    if(!pl||!pl.pilares||!pl.habitos){pl=sd.plano;S.plano=pl;persistir('plano');}
    if(!aj||!aj.inicio){aj=sd.ajustes;S.ajustes=aj;persistir('ajustes');}
  }
  S.plano=pl;S.ajustes=aj;
}

/* ===== render ===== */
function setAba(a){if(a!=='hoje'&&a!=='eq'&&a!=='pilares')a='hoje';aba=a;if(a==='hoje')diaVer=hojeStr;render();}
/* campo de formulário da folha em uso (ex.: horário do lembrete): não recriar a folha por baixo do dedo */
function editandoFolha(){
  var a=document.activeElement,s=document.getElementById('sheet');
  return !!(a&&s&&a!==s&&s.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
function render(){
  var sc=document.getElementById('screen'),top=sc.scrollTop,html='';
  /* pontuação num try próprio: se falhar, a aba Pilares ainda abre (Atualizar app, Exportar backup, Conta) */
  try{P=EQ.pontuacao(ctx(),hojeStr);}catch(errP){P=null;console.error('Foco: erro no cálculo da pontuação',errP);}
  try{
    if(!P&&aba!=='pilares')throw new Error('pontuação indisponível');
    html=aba==='eq'?htmlEq():(aba==='pilares'?htmlPilares():htmlHoje());
  }catch(err){
    console.error('Foco: erro ao montar a tela',err);
    html='<div class="vazio">Não consegui montar esta tela.</div><section class="card">'+
         '<button class="lrow" data-a="atualizar"><span class="ric"><i class="ti ti-refresh"></i></span><span class="rtx"><b>Atualizar app</b><small>baixa a versão mais nova</small></span></button>'+
         '<button class="lrow" data-a="exportar"><span class="ric"><i class="ti ti-download"></i></span><span class="rtx"><b>Exportar backup</b><small>arquivo JSON com plano, registros e ajustes</small></span></button>'+
         '</section>';
  }
  sc.innerHTML=html;
  sc.scrollTop=(abaAnterior===aba)?top:0;
  abaAnterior=aba;
  var ts=['hoje','eq','pilares'];
  for(var i=0;i<ts.length;i++){var t=document.getElementById('tab-'+ts[i]);if(t)t.className='tab'+(ts[i]===aba?' on':'');}
  var f=folhas[folhas.length-1];
  if(f&&f.vivo&&!editandoFolha())renderFolha();
  syncUI();
}

/* ===== aba Hoje ===== */
function setDia(ds){
  if(ds>hojeStr)ds=hojeStr;
  var mn=minDia();if(ds<mn)ds=mn;
  diaVer=ds;render();
}
function htmlHoje(){
  var c=ctx(),ds=diaVer,ehHoje=(ds===hojeStr),ontem=ontemStr(),h='';
  var titulo=ehHoje?'Hoje':(ds===ontem?'Ontem':fmtCurto(ds));
  h+='<header class="hd"><div class="hd-row">'+
     '<button class="nav first" data-a="diaMenos" aria-label="Dia anterior"'+(ds>minDia()?'':' disabled')+'><i class="ti ti-chevron-left"></i></button>'+
     '<h1>'+esc(titulo)+'</h1>'+
     '<button class="nav" data-a="diaMais" aria-label="Próximo dia"'+(ds<hojeStr?'':' disabled')+'><i class="ti ti-chevron-right"></i></button>'+
     '<span class="grow"></span>'+
     '<button class="sync" id="syncBtn" data-a="conta" aria-label="Sincronização"><i class="ti ti-cloud-off" id="syncIc"></i></button>'+
     '<button class="pt" data-a="aba" data-id="eq" aria-label="Pontuação de Equilíbrio"><small>Equilíbrio</small><b>'+P.valor+'</b></button>'+
     '</div><div class="hd-sub">'+esc(fmtLongo(ds))+'</div></header>';

  if(ehHoje){
    /* 1. modo viagem */
    if(EQ.emViagem(S.ajustes,hojeStr)){
      var aberta=viagemAberta()>=0;
      h+='<div class="banner"><i class="ti ti-plane"></i><span>'+(aberta?'Modo viagem · plano mínimo':'Último dia de viagem · plano mínimo')+'</span>'+
         (aberta?'<button class="lnk" data-a="viagem">encerrar</button>':'')+'</div>';
    }
    /* 2. ontem ficou aberto */
    if(ontem>=inicio()&&!EQ.diaFechado(S.registros,ontem)){
      h+='<div class="ac"><div class="ac-t">Ontem ficou aberto</div><div class="btns">'+
         '<button class="btn pri" data-a="dia" data-id="'+ontem+'">Preencher ontem</button>'+
         '<button class="btn" data-a="fechar" data-id="'+ontem+'">Não fiz nada</button></div></div>';
    }
    /* 3. revisão do mês */
    if(EQ.revisaoRotinaDevida(c,hojeStr)){
      var rot=EQ.habitos(S.plano,{estado:'rotina'});
      h+='<div class="ac"><div class="ac-t">Revisão do mês · continuam no automático?</div><div class="ac-l">';
      for(var r=0;r<rot.length;r++){
        h+='<div class="lrow"><span class="ric">'+icone(rot[r].icon)+'</span><span class="rtx"><b>'+esc(rot[r].nome)+'</b></span>'+
           '<button class="btn sm" data-a="ativarH" data-id="'+esc(rot[r].id)+'">Voltar a marcar</button></div>';
      }
      h+='</div><button class="btn pri wide" data-a="rotinaOk">Tudo certo</button></div>';
    }
  }

  /* lista por pilar */
  var viag=EQ.emViagem(S.ajustes,ds),pausados=0,total=0,pils=EQ.pilares(S.plano,'ativo'),at=EQ.habitosAtivos(S.plano);
  var dia=S.registros[ds];
  for(var i=0;i<pils.length;i++){
    var p=pils[i],linhas='';
    for(var j=0;j<at.length;j++){
      var hb=at[j];
      if(hb.pid!==p.id)continue;
      if(ds<EQ.inicioHabito(hb,S.ajustes))continue;   // ainda não estava ativo nesse dia
      if(viag&&EQ.modoViagem(hb)==='pausa'){pausados++;continue;}
      linhas+=htmlLinha(c,hb,ds,dia);total++;
    }
    if(!linhas)continue;
    var pp=pilarPont(p.id);
    h+='<div class="grp"><div class="grp-h"><span class="dot c-'+(pp?pp.cor:'sem')+'"></span>'+esc(p.nome)+'</div><div class="card">'+linhas+'</div></div>';
  }
  if(!total&&!pausados)h+='<div class="vazio">Nenhum hábito ativo. Ative hábitos na aba Pilares.</div>';
  if(viag&&pausados)h+='<div class="pausados">'+plural(pausados,'hábito pausado','hábitos pausados')+' na viagem</div>';

  /* fechar o dia: o botão só some com o fechamento explícito (_f); para o push e o "ontem ficou aberto",
     qualquer marcação já conta como dia fechado (EQ.diaFechado) */
  if(dia&&dia._f){
    h+='<button class="fechar done" data-a="reabrir" data-id="'+ds+'"><i class="ti ti-lock"></i>Dia fechado · reabrir</button>';
  }else{
    h+='<button class="fechar" data-a="fechar" data-id="'+ds+'">'+(ehHoje?'Fechar o dia':(ds===ontem?'Fechar ontem':'Fechar este dia'))+'</button>';
  }
  return h;
}
function htmlLinha(c,hb,ds,dia){
  var sub=EQ.progresso(c,hb,ds),on=EQ.registrado(hb,dia);
  var tx='<span class="ric">'+icone(hb.icon)+'</span><span class="rtx"><b>'+esc(hb.nome)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>';
  if(hb.tipo==='nota'){
    var sel=on?+dia[hb.id]:null,vals=[0,0.5,1],ics=['mood-sad','mood-neutral','mood-smile'],nomes=['mal','mais ou menos','bem'],b='';
    for(var k=0;k<3;k++){
      var ativo=(sel!==null&&Math.abs(sel-vals[k])<1e-6);
      b+='<button class="nt'+(ativo?' on n'+k:'')+'" data-a="nota" data-id="'+esc(hb.id)+'" data-v="'+vals[k]+'" aria-label="'+nomes[k]+'"><i class="ti ti-'+ics[k]+'"></i></button>';
    }
    return '<div class="row'+(on?' on':'')+(dia&&dia._f?' trv':'')+'">'+tx+'<span class="notas">'+b+'</span></div>';
  }
  return '<button class="row'+(on?' on':'')+(dia&&dia._f?' trv':'')+'" data-a="check" data-id="'+esc(hb.id)+'" aria-pressed="'+(on?'true':'false')+'">'+tx+
         '<span class="ck">'+(on?'<i class="ti ti-check"></i>':'')+'</span></button>';
}

function curvaSVG(serie){
  var W=320,H=72,pt=6,pb=6,N=56,n=serie.length,lo=100,hi=100,i;
  for(i=0;i<n;i++){if(serie[i]<lo)lo=serie[i];if(serie[i]>hi)hi=serie[i];}
  lo=Math.max(0,Math.floor((lo-5)/10)*10);hi=Math.min(120,Math.ceil((hi+5)/10)*10);
  if(hi-lo<30){lo=Math.max(0,hi-30);}
  function y(v){return (pt+(hi-v)/(hi-lo)*(H-pt-pb)).toFixed(1);}
  function x(k){return (W*(N-n+k)/(N-1)).toFixed(1);}
  var s='<svg class="curva" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva da pontuação nas últimas 8 semanas">';
  s+='<line class="cv-ref" x1="0" x2="'+W+'" y1="'+y(100)+'" y2="'+y(100)+'"/>';
  s+='<text class="cv-t" x="0" y="'+(y(100)-4)+'">100</text>';
  if(n>=2){
    var d='';
    for(i=0;i<n;i++)d+=(i?' L':'M')+x(i)+' '+y(serie[i]);
    s+='<path class="cv-area" d="'+d+' L'+x(n-1)+' '+H+' L'+x(0)+' '+H+' Z"/>';
    s+='<path class="cv-line" d="'+d+'"/>';
    s+='<circle class="cv-pt" cx="'+x(n-1)+'" cy="'+y(serie[n-1])+'" r="3.2"/>';
  }
  return s+'</svg>';
}
var RADAR_CURTO={treino:'Treino',sono:'Sono',alimentacao:'Alim.',conhecimento:'Conhec.',carreira:'Carreira',descanso:'Descanso',debora:'Débora'};
function rotuloCurto(pp){
  if(RADAR_CURTO[pp.id])return RADAR_CURTO[pp.id];
  var w=String(pp.nome||'').split(' ')[0];
  return w.length>9?w.slice(0,7)+'.':w;
}
function radarSVG(pils){
  var N=pils.length;
  if(N<3)return '<div class="vazio">A roda precisa de pelo menos 3 pilares ativos.</div>';
  var W=320,H=290,cx=160,cy=145,R=96,i,k,s='',pts=[];
  function ang(j){return -Math.PI/2+2*Math.PI*j/N;}
  function px(j,r){return (cx+Math.cos(ang(j))*r).toFixed(1);}
  function py(j,r){return (cy+Math.sin(ang(j))*r).toFixed(1);}
  s+='<svg class="radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Roda da vida">';
  var aneis=[0.25,0.5,0.75,1];
  for(k=0;k<aneis.length;k++){
    var poly=[];for(i=0;i<N;i++)poly.push(px(i,R*aneis[k])+','+py(i,R*aneis[k]));
    s+='<polygon class="rd-ring" points="'+poly.join(' ')+'"/>';
  }
  for(i=0;i<N;i++)s+='<line class="rd-ax" x1="'+cx+'" y1="'+cy+'" x2="'+px(i,R)+'" y2="'+py(i,R)+'"/>';
  for(i=0;i<N;i++){
    var pp=pils[i],off=(pp.cor==='pausado'||pp.valor===null),v=off?0:Math.max(0,Math.min(pp.valor,120))/120;
    pts.push(px(i,R*v)+','+py(i,R*v));
  }
  s+='<polygon class="rd-area" points="'+pts.join(' ')+'"/>';
  for(i=0;i<N;i++){var xy=pts[i].split(',');s+='<circle class="rd-pt" cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.6"/>';}
  for(i=0;i<N;i++){
    var q=pils[i],desl=(q.cor==='pausado'||q.valor===null),c=Math.cos(ang(i)),sn=Math.sin(ang(i));
    var lx=cx+c*(R+16),ly=cy+sn*(R+16);
    var anc=c>0.3?'start':(c<-0.3?'end':'middle');
    var dy=sn<-0.3?-12:(sn>0.3?10:-2);
    s+='<text class="rd-l'+(desl?' off':'')+'" x="'+lx.toFixed(1)+'" y="'+(ly+dy).toFixed(1)+'" text-anchor="'+anc+'">'+esc(rotuloCurto(q))+
       '<tspan class="rd-v" x="'+lx.toFixed(1)+'" dy="13">'+esc(valorTxt(q))+'</tspan></text>';
  }
  return s+'</svg>';
}

/* ===== aba Pilares ===== */
function planoCurto(h){
  var pl=h.plano||{},n=+pl.n||0,d=+pl.dias||7;
  if(d===7&&n>=7)return 'todo dia';
  if(d===7)return n+'×';
  if(d===14)return n+'× a cada 15 dias';
  if(d===30)return n+'× no mês';
  return EQ.textoPlano(h);
}
function nomeMin(s){s=String(s||'');return (s.length>1&&s.charAt(1)===s.charAt(1).toLowerCase())?s.charAt(0).toLowerCase()+s.slice(1):s;}
function resumoPilar(pid){
  var hs=ativosDoPilar(pid),out=[];
  for(var i=0;i<hs.length;i++)out.push(nomeMin(hs[i].nome)+' '+planoCurto(hs[i]));
  return out.length?out.join(' · '):'nenhum hábito ativo';
}

function pegarSessao(){
  if(!sb)return;
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(sess&&sess.user)adotarSessao(sess);else syncUI();
  },function(){syncUI();});
}
function cloudInit(){
  if(!CLOUD_ON)return;
  if(sb){if(!cloudUser)pegarSessao();return;}
  loadSb(function(){
    if(sb)return;
    try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);}catch(e){syncErro='falha ao iniciar a nuvem';syncUI();return;}
    syncErro='';
    try{sb.auth.onAuthStateChange(function(ev,sess){
      if(ev==='SIGNED_OUT'){if(cloudUser){cloudUser=null;pulledOk=false;pend={};clearTimeout(subT);render();}return;}
      if(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'||ev==='INITIAL_SESSION'||ev==='USER_UPDATED'){
        setTimeout(function(){adotarSessao(sess);},0);   // fora do lock do auth-js, como a doc do Supabase recomenda
      }
    });}catch(e){}
    pegarSessao();
  });
}
function planoValido(p){return !!(p&&p.pilares&&p.pilares.length>0&&p.habitos&&p.habitos.length>0);}
function registrosValidos(r){return !!(r&&typeof r==='object'&&Object.prototype.toString.call(r)!=='[object Array]');}
function ajustesValidos(a){return !!(a&&typeof a==='object'&&a.inicio);}
function lerNuvem(rows){
  var nv={plano:null,registros:null,ajustes:null},i;
  rows=rows||[];
  for(i=0;i<rows.length;i++){
    if(rows[i].key===EQ.KEYS.plano&&planoValido(rows[i].value))nv.plano=rows[i].value;
    else if(rows[i].key===EQ.KEYS.registros&&registrosValidos(rows[i].value))nv.registros=rows[i].value;
    else if(rows[i].key===EQ.KEYS.ajustes&&ajustesValidos(rows[i].value))nv.ajustes=rows[i].value;
  }
  return nv;
}
/* junta a nuvem na memória (loc = cópia local a usar; padrão = S), grava no LS e redesenha */
function aplicarMerge(nv,loc){
  var m=EQ.mergeEstado(loc||{plano:S.plano,registros:S.registros,ajustes:S.ajustes},nv);
  if(m.plano)S.plano=m.plano;
  if(m.ajustes)S.ajustes=m.ajustes;
  S.registros=m.registros||{};
  persistir('plano');persistir('registros');persistir('ajustes');
  if(diaVer<minDia())diaVer=hojeStr;
  render();
  return m;
}
function sync(){
  vigia();
  if(!sb||!cloudUser||pulling)return;
  pulling=true;syncErro='';ultimoSync=Date.now();syncUI();
  var uid=cloudUser.id,op=novaOp();opPull=op;
  comSinal(sb.from('foco_state').select('key,value').eq('user_id',uid).in('key',[EQ.KEYS.plano,EQ.KEYS.registros,EQ.KEYS.ajustes]),op).then(function(r){
    if(opPull!==op)return;                 // o vigia já desistiu deste pedido
    opPull=null;pulling=false;
    if(r.error){syncErro=r.error.message||'erro ao ler a nuvem';syncUI();return;}   // não marca pulledOk, não sobe nada
    if(!cloudUser||cloudUser.id!==uid){syncUI();if(cloudUser)sync();return;}       // trocou de conta no meio: puxa a nova
    var nv=lerNuvem(r.data),loc={plano:S.plano,registros:S.registros,ajustes:S.ajustes};
    if(!lsLer('lastSync')){   /* 1º pull deste aparelho: uma edição feita antes de entrar pode ser só a semente mexida */
      var cp=!!(nv.plano&&+nv.plano._t>1&&S.plano&&+S.plano._t>1&&+S.plano._t>+nv.plano._t);
      var ca=!!(nv.ajustes&&+nv.ajustes._t>1&&S.ajustes&&+S.ajustes._t>1&&+S.ajustes._t>+nv.ajustes._t);
      if((cp||ca)&&confirm('Já existe um plano na nuvem, e este aparelho foi alterado antes de entrar. OK = usar o da nuvem · Cancelar = manter o deste aparelho')){
        /* a escolha vira a edição mais nova: vence a cópia local, o LS e outra instância aberta neste aparelho */
        var agora=Date.now();
        if(cp){loc.plano=copia(nv.plano);loc.plano._t=agora;}
        if(ca){loc.ajustes=copia(nv.ajustes);loc.ajustes._t=agora;if(S.ajustes.inicio&&S.ajustes.inicio<loc.ajustes.inicio)loc.ajustes.inicio=S.ajustes.inicio;}
      }
    }
    var m=aplicarMerge(nv,loc);
    pulledOk=true;
    lsGravar('lastSync',new Date().toISOString());
    var t={},k;
    for(k in pend)if(pend[k])t[k]=true;
    if(m.subir.plano)t.plano=true;
    if(m.subir.registros)t.registros=true;
    if(m.subir.ajustes)t.ajustes=true;
    subir(t,true);   // a leitura acabou de ser feita: não precisa reler
    syncUI();
  },function(e){if(opPull!==op)return;opPull=null;pulling=false;syncErro=(e&&e.message)||'erro de rede';syncUI();});
}
/* subir(tipos, jaLido): relê a nuvem, junta e só então grava (uma instância aberta há horas não apaga
   o que outro aparelho subiu). jaLido = o sync() acabou de ler. Se a leitura falhar, nada é gravado. */
function subir(tipos,jaLido){
  vigia();
  if(!sb||!cloudUser||!pulledOk)return;
  var ks=[],k,i;
  for(k in tipos)if(tipos[k]&&(k==='plano'||k==='registros'||k==='ajustes'))ks.push(k);
  if(!ks.length)return;
  if(subindo||pulling){for(i=0;i<ks.length;i++)pend[ks[i]]=true;clearTimeout(subT);subT=setTimeout(function(){subir(pend);},1500);return;}
  /* validação: nunca subir estado vazio/parcial */
  if(!planoValido(S.plano)||!registrosValidos(S.registros)||!ajustesValidos(S.ajustes)){
    console.warn('Foco: estado local inválido, subida abortada',{plano:!!S.plano,registros:!!S.registros,ajustes:!!S.ajustes});
    return;
  }
  var uid=cloudUser.id,op=novaOp();
  op.ks=ks;opSub=op;subindo=true;syncUI();
  function vale(){return opSub===op;}   // false = o vigia já desistiu desta subida
  function fim(){opSub=null;subindo=false;}
  function falhou(msg){if(!vale())return;fim();for(var j=0;j<ks.length;j++)pend[ks[j]]=true;syncErro=msg||'erro ao salvar na nuvem';syncUI();}
  function gravar(){
    if(!cloudUser||cloudUser.id!==uid){fim();syncUI();return;}
    if(!planoValido(S.plano)||!registrosValidos(S.registros)||!ajustesValidos(S.ajustes)){fim();console.warn('Foco: estado inválido após merge, subida abortada');syncUI();return;}
    var rows=[],t=new Date().toISOString(),x;
    for(x=0;x<ks.length;x++){
      k=ks[x];
      if((k==='plano'||k==='ajustes')&&!(+S[k]._t>0)){S[k]._t=1;persistir(k);}   // semente perde para qualquer edição real
      delete pend[k];   // depois do persistir: o que ele juntou do LS sobe nesta mesma subida
      rows.push({user_id:uid,key:EQ.KEYS[k],value:S[k],updated_at:t});
    }
    try{rows.push({user_id:uid,key:EQ.KEYS.resumo,value:EQ.resumo(ctx(),hojeStr),updated_at:t});}catch(e){console.warn('Foco: resumo não calculado',e);}
    op.desde=Date.now();
    comSinal(sb.from('foco_state').upsert(rows,{onConflict:'user_id,key'}),op).then(function(r){
      if(!vale())return;
      if(r.error){falhou(r.error.message);return;}
      fim();syncErro='';
      lsGravar('lastSync',new Date().toISOString());
      syncUI();
    },function(e){falhou(e&&e.message);});
  }
  if(jaLido){gravar();return;}
  comSinal(sb.from('foco_state').select('key,value').eq('user_id',uid).in('key',[EQ.KEYS.plano,EQ.KEYS.registros,EQ.KEYS.ajustes]),op).then(function(r){
    if(!vale())return;
    if(r.error){falhou(r.error.message||'erro ao ler a nuvem');return;}   // nada gravado; os tipos voltam para a fila
    if(!cloudUser||cloudUser.id!==uid){fim();syncUI();return;}
    var m=aplicarMerge(lerNuvem(r.data)),q=['plano','registros','ajustes'],y;
    for(y=0;y<q.length;y++)if((m.subir[q[y]]||pend[q[y]])&&ks.indexOf(q[y])<0)ks.push(q[y]);
    ultimoSync=Date.now();
    gravar();
  },function(e){falhou((e&&e.message)||'erro de rede');});
}
function temPend(){for(var k in pend)if(pend[k])return true;return false;}
/* sobe o que está pendente sem esperar o debounce (app indo para segundo plano, dia fechado).
   Se já houver pedido em curso não faz nada: subir() reagenda e o resto sobe na volta ao app ou no próximo boot. */
function subirJa(){
  vigia();
  if(cloudUser&&pulledOk&&temPend()&&!subindo&&!pulling){clearTimeout(subT);subT=null;subir(pend);}
}
function estadoSync(){
  if(!cloudUser)return 'off';
  if(syncErro)return 'erro';
  if(pulling||subindo||temPend()||!pulledOk)return 'up';
  return 'ok';
}
function fmtSync(){
  var t=lsLer('lastSync');if(!t)return 'nunca';
  var d=new Date(t),n=new Date(),hm=p2(d.getHours())+':'+p2(d.getMinutes());
  if(isNaN(d.getTime()))return 'nunca';
  return d.toDateString()===n.toDateString()?('hoje '+hm):(p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+hm);
}
function syncTexto(){
  var st=estadoSync();
  if(st==='off')return CLOUD_ON?'Sem conta conectada · dados só neste aparelho':'Nuvem não configurada';
  if(st==='erro')return 'Aviso: '+syncErro;
  if(pulling)return 'Sincronizando…';
  if(subindo)return 'Salvando na nuvem…';
  if(st==='up')return 'Alterações pendentes';
  return 'Sincronizado · última vez '+fmtSync();
}
function syncUI(){
  var st=estadoSync(),ic=document.getElementById('syncIc'),b=document.getElementById('syncBtn');
  if(ic)ic.className='ti '+(st==='ok'?'ti-cloud-check':(st==='up'?'ti-cloud-up':'ti-cloud-off'));
  if(b){b.className='sync s-'+st;b.title=syncTexto();}
  var t=document.getElementById('syncTxt');if(t)t.textContent=syncTexto();
}
function entrar(){
  if(!sb){toast('Nuvem ainda carregando');return;}
  var em=campo('cEmail').replace(/^\s+|\s+$/g,''),pw=campo('cPass');
  if(!em||!pw){toast('Preencha e-mail e senha');return;}
  var st=document.getElementById('syncTxt');if(st)st.textContent='Entrando…';
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){if(st)st.textContent='Falhou: '+r.error.message;return;}
    cloudUser=r.data.user;pulledOk=false;
    fecharTodas();render();toast('Conectado');
    sync();
  },function(e){if(st)st.textContent='Falhou: '+((e&&e.message)||e);});
}
function sair(){
  if(!sb)return;
  sb.auth.signOut().then(function(){
    cloudUser=null;pulledOk=false;pend={};clearTimeout(subT);syncErro='';
    fecharTodas();render();toast('Saiu da conta · dados locais mantidos');
  });
}
function folhaConta(){
  var h=cabFolha('Conta e sincronização');
  if(!CLOUD_ON)return h+'<div class="vazio">Nuvem não configurada.</div>';

}

/* ===== Web Push ===== */
var VAPID_PUBLIC='BH9Zr-JA_68JJPCTuudMPhlFyt2UNM-Lhg6BRFKu_dNCHgejNQpfcvJltoe2SBenTBQhzteKKn5iqp9E-5FEifc';
function urlB64ToU8(b64){var pad='';while((b64.length+pad.length)%4)pad+='=';var base=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');var raw=atob(base);var arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
function pushSet(msg){pushMsg=msg;var e=document.getElementById('pushSub');if(e)e.textContent=msg;}
function pushSupported(){return ('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);}
function pushStandalone(){try{return (window.matchMedia&&matchMedia('(display-mode:standalone)').matches)||window.navigator.standalone===true;}catch(e){return false;}}
function pushEnable(){
  if(!pushSupported()){pushSet('Este navegador não suporta notificações push.');toast('Sem suporte a push aqui');return;}
  if(!pushStandalone()){pushSet('No iPhone: instale na tela inicial primeiro (Compartilhar → Adicionar à Tela de Início) e abra pelo ícone.');toast('Instale na tela inicial primeiro');return;}
  if(!sb||!cloudUser){pushSet('Entre na sua conta em Conta e sincronização antes.');toast('Faça login primeiro');return;}
  pushSet('Pedindo permissão…');
  Notification.requestPermission().then(function(perm){
    if(perm!=='granted'){pushSet('Permissão negada. Libere em Ajustes do iPhone → Foco → Notificações.');return;}
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(ex){
        return ex||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});
      });
    }).then(function(sub){
      var j=sub.toJSON()||{};var k=j.keys||{};
      return sb.from('foco_push_subs').upsert({user_id:cloudUser.id,endpoint:j.endpoint,p256dh:k.p256dh,auth:k.auth,ua:navigator.userAgent},{onConflict:'user_id,endpoint'});
    }).then(function(r){
      if(r&&r.error){pushSet('Erro ao salvar no servidor: '+r.error.message);return;}
      pushSet('Notificações ativadas neste aparelho. Use Enviar teste para conferir.');toast('Notificações ativadas');
    }).catch(function(e){pushSet('Falhou: '+((e&&e.message)||e));});
  }).catch(function(e){pushSet('Falhou na permissão: '+((e&&e.message)||e));});
}
function pushTest(){
  if(!sb||!cloudUser){toast('Faça login primeiro');pushSet('Entre na sua conta antes.');return;}
  pushSet('Enviando teste…');
  sb.functions.invoke('foco-send-push',{body:{title:'Teste do lembrete da noite',body:textoLembrete(),url:'/Foco/',tag:'foco-noite'}}).then(function(r){
    if(r.error){pushSet('Erro no envio: '+r.error.message);toast('Erro no envio');return;}
    var d=r.data||{};
    if(d.error){pushSet(d.error==='no_subscriptions'?'Ative as notificações primeiro (nenhum aparelho registrado).':('Retorno: '+d.error));return;}
    pushSet('Enviado a '+(d.sent||0)+' de '+(d.total||0)+' aparelho(s)'+(d.failed?(' · falhas: '+d.failed):'')+'.');
    toast('Teste enviado');
  }).catch(function(e){pushSet('Falhou: '+((e&&e.message)||e));});
}

/* ===== atualizar app ===== */
function appReload(){
  toast('Atualizando…');
  var done=false;function go(){if(done)return;done=true;location.reload();}
  try{
    if('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.update().catch(function(){});}));
      }).then(function(){setTimeout(go,350);},go);
      setTimeout(go,2500); /* rede de segurança: recarrega mesmo se o SW travar */
    } else { setTimeout(go,200); }
  }catch(e){ go(); }
}

  reabrir:function(ds){reabrirDia(ds);},
  rotinaOk:function(){rotinaOk();},
  ativarH:function(id){ativarHabito(id);},
  ativarP:function(id){ativarPilar(id);},
  pilarEspera:function(id){pilarEspera(id);},

  seg:function(v,el){var bs=el.parentNode.children;for(var i=0;i<bs.length;i++)bs[i].className=(bs[i]===el?'on':'');},

document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-a]'):null;
  if(!el||el.disabled)return;
  var fn=ACOES[el.getAttribute('data-a')];
  if(!fn)return;
  e.preventDefault();
  try{fn(el.getAttribute('data-id'),el);}catch(err){console.error('Foco: erro na ação',err);toast('Algo deu errado');}
});

});

/* ===== virada do dia, volta ao app e instâncias abertas por muito tempo ===== */
function checaVirada(){
  var h=EQ.hoje();
  if(h===hojeStr)return false;
  var eraHoje=(diaVer===hojeStr);
  hojeStr=h;
  if(eraHoje||diaVer<minDia())diaVer=hojeStr;
  render();
  return true;
}
function religarNuvem(){
  if(!CLOUD_ON||cloudUser)return;
  cloudInit();   // sem sb: recarrega o supabase-js; com sb e sem sessão: chama getSession de novo
}
function puxarSeVelho(){
  vigia();
  if(cloudUser){if(!pulling&&Date.now()-ultimoSync>10000)sync();}
  else religarNuvem();
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){subirJa();return;}   // indo para segundo plano: envia o pendente antes da suspensão
  checaVirada();
  puxarSeVelho();
});
window.addEventListener('pagehide',function(){subirJa();});
window.addEventListener('online',function(){puxarSeVelho();});
/* iframe do HUB ou janela sem foco nunca recebem visibilitychange: puxa ao ganhar foco e de tempos em tempos.
   Com folha aberta não puxa (não redesenha uma folha no meio de uma edição). Não exige pulledOk: refaz o 1º pull que falhou. */
function syncSeParado(){
  vigia();
  if(!cloudUser||pulling||subindo||document.hidden||folhas.length)return;
  if(Date.now()-ultimoSync<10000)return;
  checaVirada();sync();
}
window.addEventListener('focus',syncSeParado);
window.addEventListener('pageshow',function(e){if(e&&e.persisted)syncSeParado();});
setInterval(function(){if(Date.now()-ultimoSync>=60000)syncSeParado();else vigia();},15000);
setInterval(checaVirada,60000);

/* ===== outra instância (aba ou iframe do HUB) gravou no LS: junta na memória ===== */
window.addEventListener('storage',function(e){
  var k=e&&e.key;
  if(k!==LS+'plano'&&k!==LS+'registros'&&k!==LS+'ajustes')return;
  k=k.substring(LS.length);
  if(!juntarLS(k))return;
  var a={},b={};a[k]=S[k];b[k]=lsObj(k);
  if(EQ.mergeEstado(a,b).subir[k])lsGravar(k,JSON.stringify(S[k]));   // só regrava se a memória tinha algo que o LS não tem (sem pingue-pongue)
  if(cloudUser){pend[k]=true;if(pulledOk&&!pulling){clearTimeout(subT);subT=setTimeout(function(){subir(pend);},1200);}}
  if(diaVer<minDia())diaVer=hojeStr;
  render();
});

/* ===== boot ===== */
aplicarTema(lsLer('tema')==='light'?'light':'dark');
carregar();
render();
cloudInit();
</script>
